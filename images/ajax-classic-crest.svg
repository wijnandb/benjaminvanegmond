<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4192c"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4192c"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="200" cy="200" r="185" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Inner border ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- AJAX text along top arc -->
  <path id="textArc" d="M 200,200 m -140,0 a 140,140 0 1,1 280,0" fill="none"/>
  <text font-family="serif" font-size="28" font-weight="bold" fill="#1a1a1a" letter-spacing="18">
    <textPath href="#textArc" startOffset="18%">A J A X</textPath>
  </text>

  <!-- AMSTERDAM text along bottom arc -->
  <path id="bottomArc" d="M 60,220 a 140,140 0 0,0 280,0" fill="none"/>
  <text font-family="serif" font-size="14" fill="#1a1a1a" letter-spacing="5">
    <textPath href="#bottomArc" startOffset="12%">A M S T E R D A M</textPath>
  </text>

  <!-- Portrait of Ajax (Greek hero in profile, facing left) -->
  <g transform="translate(200,210)" clip-path="url(#circleClip)">
    <!-- Neck and chin -->
    <path d="M -10,80 C -10,60 -20,40 -30,25 C -35,18 -38,10 -35,0
             C -32,-10 -28,-18 -22,-25" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Face profile (forehead, nose, lips, chin) -->
    <path d="M -22,-25 C -18,-35 -15,-45 -20,-55
             C -22,-60 -25,-62 -30,-63
             C -35,-60 -40,-55 -42,-48
             C -44,-42 -43,-35 -40,-30
             C -38,-26 -36,-22 -38,-18
             C -40,-14 -44,-12 -46,-8
             C -44,-4 -40,-2 -38,0
             C -40,4 -42,8 -40,12
             C -38,15 -35,18 -30,25"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye -->
    <ellipse cx="-30" cy="-38" rx="5" ry="3" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
    <circle cx="-31" cy="-38" r="1.5" fill="#1a1a1a"/>

    <!-- Ear -->
    <path d="M -15,-30 C -10,-35 -8,-28 -12,-24" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Helmet - main dome -->
    <path d="M -50,-55 C -48,-80 -35,-100 -10,-110
             C 10,-115 35,-110 50,-95
             C 60,-85 65,-70 60,-55
             C 55,-45 45,-40 30,-38"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Helmet crest/plume -->
    <path d="M -10,-110 C -5,-130 5,-140 20,-142
             C 35,-140 50,-130 55,-115
             C 58,-105 55,-95 50,-90"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Helmet plume feathers -->
    <path d="M 20,-142 C 30,-145 45,-140 55,-130
             C 65,-120 70,-105 65,-90
             C 60,-80 55,-75 48,-72"
          fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

    <!-- Helmet visor/brim -->
    <path d="M -50,-55 C -55,-52 -58,-48 -55,-44
             C -52,-40 -46,-38 -40,-40"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Helmet decoration lines -->
    <path d="M -20,-65 C -15,-75 -5,-82 5,-85" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    <path d="M -15,-60 C -10,-70 0,-78 10,-82" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
    <path d="M 30,-65 C 35,-55 38,-48 35,-40" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>

    <!-- Hair/curls below helmet -->
    <path d="M -12,-24 C -5,-20 0,-25 5,-30 C 10,-35 15,-38 20,-35
             C 25,-30 20,-22 15,-18 C 10,-15 5,-18 0,-22"
          fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Neck armor/collar -->
    <path d="M -10,30 C 0,25 10,28 15,35 C 20,42 15,50 5,55"
          fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

    <!-- Shoulder armor -->
    <path d="M -10,80 C 5,70 20,65 35,70 C 50,75 60,85 55,100"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -30,60 C -40,70 -50,80 -55,95"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Small red-white shield (Ajax club colors) -->
  <g transform="translate(290,250)">
    <path d="M 0,-20 L 15,-12 L 15,10 C 15,18 8,24 0,28 C -8,24 -15,18 -15,10 L -15,-12 Z"
          fill="url(#shieldGrad)" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Red stripe -->
    <rect x="-5" y="-15" width="10" height="38" fill="#d4192c" opacity="0.9"/>
    <!-- White stripe borders -->
    <line x1="-5" y1="-15" x2="-5" y2="23" stroke="#ffffff" stroke-width="1"/>
    <line x1="5" y1="-15" x2="5" y2="23" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Decorative dots between text arcs -->
  <circle cx="95" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="305" cy="160" r="3" fill="#1a1a1a"/>
</svg>